spring:
  application:
    name: inventory-service
  
  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3308/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
  
  # Kafka Configuration (minimal - detailed config in KafkaConfig.java)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-service-group

# Server Configuration
server:
  port: 8082

# Logging Configuration
logging:
  level:
    root: INFO
    in.codefarm.inventory_service: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
